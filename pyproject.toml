[project]
name = "autose"
version = "0.1.0"
description = "Autonomous bug fixing with a local small language model, evaluated on SWE-bench Lite"
requires-python = ">=3.11,<3.13"
dependencies = [
    "swebench==5.0.2",   # official SWE-bench test specs, log parsers and grading
    "docker>=7",
    "requests>=2.31",    # Ollama client
    "pytest>=8",         # runs reproduction tests and the unit tests
]

[project.optional-dependencies]
dev = ["pytest-cov>=5", "ruff>=0.6"]   # quality scorecard: coverage and lint (python -m autose.evaluation.quality)

[tool.setuptools.packages.find]
include = ["autose*"]
