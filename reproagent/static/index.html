<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReproAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#421d24; --violet:#714cb6; --lilac:#d4c7ff; --lilac-soft:#efeaff;
  --canvas:#f2f0eb; --mist:#e3e3e2; --ink:#292827; --stone:#666666; --paper:#ffffff; --code:#faf9f6;
  --font:'Super Sans VF', Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:460 15px/1.5 var(--font);font-feature-settings:"ss01","tnum";-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--violet);text-decoration:none}a:hover{text-decoration:underline}
.hidden{display:none !important}

/* shell */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100vh}
aside{border-right:1px solid var(--mist);display:flex;flex-direction:column;min-height:0;background:var(--canvas)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;font-weight:600;font-size:17px;letter-spacing:-.008em}
.brand i{width:24px;height:24px;border-radius:7px;background:var(--wine);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--font);font-style:normal}
.newbtn{margin:4px 16px 12px;height:40px;border:0;border-radius:12px;background:var(--wine);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.newbtn:hover{opacity:.92}
.sect{padding:10px 20px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);display:flex;justify-content:space-between}
.slist{overflow:auto;flex:1;padding:0 10px 10px}
.sitem{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:start}
.sitem:hover{background:rgba(255,255,255,.6)}
.sitem.on{background:var(--paper);box-shadow:inset 0 0 0 1px var(--mist)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--mist)}
.dot.work{background:var(--violet);animation:pulse 1.2s ease-in-out infinite}
.dot.wait{background:var(--wine)}
.dot.done{background:var(--lilac);box-shadow:inset 0 0 0 1px var(--violet)}
.dot.fail{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--wine)}
@keyframes pulse{50%{opacity:.35}}
.stitle{font-size:14px;font-weight:540;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ssub{font-size:12px;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asidefoot{border-top:1px solid var(--mist);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.navlink{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px}
.navlink:hover,.navlink.on{background:var(--paper)}
.navlink svg{width:16px;height:16px}
.model{font-size:12px;color:var(--stone);display:flex;align-items:center;gap:8px;padding:0 10px}
.model b{font-weight:540;color:var(--ink)}
.live{width:6px;height:6px;border-radius:50%;background:var(--violet)}

/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--mist);background:rgba(242,240,235,.85);backdrop-filter:blur(12px);min-height:62px}
.top h1{font-size:16px;font-weight:540;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--mist);background:var(--paper);color:var(--stone);white-space:nowrap}
.pill.state{margin-left:auto}
.pill:empty{display:none}
.menu{display:none;border:0;background:none;cursor:pointer;padding:4px}
.route{display:flex;align-items:center;gap:0;padding:14px 28px 4px;overflow-x:auto}
.rstep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--stone);white-space:nowrap}
.rnum{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:1px solid var(--mist);background:var(--paper)}
.rstep.done .rnum{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}
.rstep.active{color:var(--ink);font-weight:540}
.rstep.active .rnum{background:var(--wine);border-color:var(--wine);color:#fff}
.rstep.fail .rnum{border-color:var(--wine);color:var(--wine)}
.rline{flex:1;min-width:24px;height:1px;background:var(--mist);margin:0 10px}
.rline.done{background:var(--violet)}

.thread{flex:1;overflow:auto;padding:20px 28px 28px;scroll-behavior:smooth}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* messages */
.msg-user{align-self:flex-end;max-width:85%;background:var(--paper);border:1px solid var(--mist);border-radius:16px 16px 4px 16px;padding:12px 16px;white-space:pre-wrap;font-size:14px}
.msg-agent{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.av{width:28px;height:28px;border-radius:8px;background:var(--wine);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--font)}
.bubble{font-size:14px;padding-top:4px}
.card{background:var(--paper);border:1px solid var(--mist);border-radius:16px;padding:18px 20px;min-width:0}
.card.attn{box-shadow:inset 0 0 0 1px var(--wine);border-color:var(--wine)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin-bottom:4px}
.kicker.wine{color:var(--wine)}
.card h3{font-size:20px;font-weight:460;letter-spacing:-.007em;margin:0 0 6px;line-height:1.25}
.card p{overflow-wrap:anywhere;margin:0 0 10px;color:var(--stone);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0 4px}
.fact{background:var(--canvas);border-radius:10px;padding:10px 12px}
.fact .k{font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fact .v{font-size:14px;font-weight:540;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fields{display:grid;gap:10px;margin:12px 0}
.field{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start;font-size:14px}
.field .k{color:var(--stone);font-size:13px;padding-top:2px}
.field .v{min-height:22px;border-radius:6px;padding:1px 4px;margin:-1px -4px}
.field .v[contenteditable=true]{background:var(--canvas);outline:1px solid var(--mist)}
.field .v:empty::before{content:"not stated";color:#aaa}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:12px/1.4 var(--mono);background:var(--lilac-soft);padding:2px 8px;border-radius:6px}
.tag.warn{font-family:var(--font);background:var(--paper);border:1px dashed var(--stone);color:var(--stone)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{height:38px;padding:0 16px;border-radius:12px;border:0;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--wine);color:#fff}
.btn.secondary{background:var(--lilac);box-shadow:inset 0 0 0 1px var(--ink);border-radius:8px}
.btn.ghost{background:none;color:var(--ink);padding:0 8px}
.btn.ghost:hover{text-decoration:underline}
.btn:disabled{opacity:.4;cursor:default}
.checks{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ck{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--lilac)}
.ck.no{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--wine);color:var(--wine)}
.ck.na{background:var(--canvas);color:var(--stone)}
details.box{border:1px solid var(--mist);border-radius:12px;margin-top:10px;overflow:hidden}
details.box summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:540;list-style:none;display:flex;justify-content:space-between;background:var(--code)}
details.box summary::after{content:"Show";color:var(--violet);font-weight:460}
details.box[open] summary::after{content:"Hide"}
details.box pre{border:0;border-top:1px solid var(--mist);border-radius:0;margin:0}
pre{background:var(--code);border:1px solid var(--mist);border-radius:12px;padding:12px 14px;overflow:auto;font:12.5px/1.6 var(--mono);max-height:380px;margin:0;white-space:pre}
.add{color:var(--violet)}.del{color:var(--wine);text-decoration:line-through;text-decoration-color:rgba(66,29,36,.35)}.hunk{color:var(--stone)}
.quote{border-left:3px solid var(--wine);padding:6px 12px;background:var(--code);border-radius:0 8px 8px 0;font:12.5px/1.5 var(--mono);color:var(--wine);margin:10px 0;white-space:pre-wrap}
.confirm{overflow-wrap:anywhere;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--canvas);font-size:14px}

/* activity */
.activity{border:1px solid var(--mist);border-radius:14px;background:var(--paper);overflow:hidden}
.ahead{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:13px}
.ahead .lbl{font-weight:540}
.ahead .cnt{color:var(--stone)}
.ahead .tog{margin-left:auto;color:var(--violet)}
.alist{border-top:1px solid var(--mist);max-height:320px;overflow:auto}
.activity.closed .alist{display:none}
.st{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:7px 14px;font-size:13px;border-bottom:1px solid var(--canvas);cursor:pointer}
.st:last-child{border-bottom:0}
.st .i{width:22px;height:22px;border-radius:6px;background:var(--canvas);display:grid;place-items:center}
.st .i svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.st.pass .i{background:var(--lilac)}.st.fail .i{box-shadow:inset 0 0 0 1px var(--wine);background:var(--paper);color:var(--wine)}
.st .tt{font-weight:540}.st .dd{color:var(--stone);font:12px/1.5 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st pre{grid-column:2;display:none;margin-top:6px;max-height:240px}
.st.open pre{display:block}.st.open .dd{white-space:normal}
.typing{display:flex;gap:4px;padding:10px 0}.typing span{width:6px;height:6px;border-radius:50%;background:var(--stone);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:translateY(-2px)}}
.spin{width:14px;height:14px;border:2px solid var(--wine);border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}

/* composer */
.composer{padding:12px 28px 20px}
.cbox{max-width:820px;margin:0 auto;background:var(--paper);border:1px solid var(--mist);border-radius:18px;padding:12px 12px 10px 16px;transition:box-shadow .15s,border-color .15s}
.cbox:focus-within{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.cbox.locked{background:var(--code)}
.cbox textarea{width:100%;border:0;outline:0;resize:none;background:none;min-height:24px;max-height:220px;font-size:15px;line-height:1.5}
.crow{display:flex;align-items:center;gap:8px;margin-top:6px}
.icon-btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--mist);background:var(--paper);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.chint{font-size:12px;color:var(--stone);margin-left:auto;margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:36px;height:36px;border-radius:12px;border:0;background:var(--wine);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.attach-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:var(--lilac-soft);padding:3px 8px;border-radius:6px;margin-bottom:6px}

/* connect */
.hero{max-width:820px;margin:24px auto 0}
.hero h2{font-weight:460;font-size:clamp(30px,4.2vw,48px);line-height:.98;letter-spacing:-.027em;margin:0 0 14px}
.hero p{color:var(--stone);font-size:16px;max-width:60ch;margin:0 0 24px}
.connect label{display:block;font-size:13px;font-weight:540;margin:14px 0 6px}
.connect input{width:100%;background:var(--canvas);border:1px solid var(--mist);border-radius:10px;padding:11px 12px;font-size:14px;outline:0}
.connect input:focus{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
.crow2{display:flex;gap:10px}.crow2 input{flex:1}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:28px 0 8px}
.flow div{background:var(--paper);border:1px solid var(--mist);border-radius:14px;padding:14px}
.flow b{display:block;font-size:12px;color:var(--wine);font-weight:700;margin-bottom:4px}
.flow span{font-size:13px;color:var(--stone)}
.bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bench button{border:1px solid var(--mist);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.bench button:hover{border-color:var(--violet);color:var(--violet)}
.err{color:var(--wine);font-size:13px;margin-top:10px;white-space:pre-wrap}

/* evaluation */
.eval{max-width:1000px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0 20px}
.stat{border:1px solid var(--mist);border-radius:14px;padding:16px;background:var(--paper)}
.stat .k{font-size:11px;color:var(--stone);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat .v{font-size:28px;letter-spacing:-.022em;margin-top:4px}
.stat .s{font-size:13px;color:var(--stone)}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--mist);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--mist)}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--stone);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
td.n{color:var(--wine)}td.z{color:var(--stone)}

.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s;background:var(--canvas)}
  aside.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(41,40,39,.25);z-index:20}
  .menu{display:block}
  .top,.route,.thread,.composer{padding-left:16px;padding-right:16px}
  .field{grid-template-columns:1fr;gap:2px}
  .pill.repo{display:none}
  .pill.state{max-width:42%;overflow:hidden;text-overflow:ellipsis}
  .top h1{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><i>R</i>ReproAgent</div>
    <button class="newbtn" id="newS">+ New session</button>
    <div class="sect"><span>Needs you</span><span id="needCount">0</span></div>
    <div class="sect" style="padding-top:2px"><span>Sessions</span></div>
    <div class="slist" id="slist"></div>
    <div class="asidefoot">
      <button class="navlink" id="navEval"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Evaluation</button>
      <div class="model"><span class="live"></span><b id="modelName">qwen3:8b</b> · local, nothing leaves this machine</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="top">
      <button class="menu" id="menu" aria-label="Sessions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="title">New session</h1>
      <span class="pill repo" id="repoPill"></span>
      <span class="pill state" id="statePill">not connected</span>
    </div>
    <div class="route" id="route"></div>
    <div class="thread" id="thread"><div class="col" id="col"></div></div>
    <div class="composer" id="composerWrap">
      <div class="cbox" id="cbox">
        <div id="attach"></div>
        <textarea id="input" rows="1" placeholder="Connect a repository to start"></textarea>
        <div class="crow">
          <button class="icon-btn" id="attachBtn" title="Attach a .md or .txt bug report"><svg viewBox="0 0 24 24"><path d="M21 12.5 12.6 21a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.6 8"/></svg>Attach report</button>
          <input type="file" id="file" accept=".md,.txt,.markdown" class="hidden">
          <span class="chint" id="chint">Enter sends · Shift+Enter for a new line</span>
          <button class="send" id="send" aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {method:"POST", body: JSON.stringify(body)});
  const j = await r.json(); if (j && j.error) throw new Error(j.error); return j;
};

let S = null;          // current session snapshot
let n = 0;             // events consumed
let bugs = [], pendingBench = null, mode = "chat", hintMode = false, attached = null;
let poller = null, actGroup = null;

/* ------------------------------------------------------------------ icons */
const P = {search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',play:'<path d="M7 5v14l11-7z"/>',
patch:'<path d="M12 5v14M5 12h14"/>',flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>',check:'<path d="m5 12 5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
chat:'<path d="M4 5h16v11H8l-4 4z"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'};
const ICON = {list_files:"folder",search_code:"search",read_file:"file",write_test:"pen",run_test:"play",edit_file:"patch",replace_lines:"patch",
  finish:"flag",text:"chat",baseline_failures:"chart",oneshot:"pen",budget_exhausted:"clock"};
const svg = k => `<svg viewBox="0 0 24 24">${P[k]||P.chat}</svg>`;

/* ------------------------------------------------------------------ route & states */
const ROUTE = [["understand","Understand"],["reproduce","Reproduce"],["verify_failure","Verify failure"],["fix","Fix"],["verify_fix","Verify fix"]];
const STATE_TEXT = {awaiting_report:"waiting for a bug report", understanding:"reading the report", awaiting_confirm:"needs you · confirm",
  reproducing:"reproducing", awaiting_fix_decision:"needs you · reproduced", needs_info:"needs you · question", not_reproduced:"not reproduced",
  env_error:"environment problem", fixing:"fixing", awaiting_apply:"needs you · fix ready", not_fixed:"not fixed", applied:"applied",
  test_saved:"test saved", discarded:"discarded", failed:"error", interrupted:"interrupted"};
const WAITING = ["awaiting_confirm","awaiting_fix_decision","needs_info","awaiting_apply","not_fixed","not_reproduced"];
const WORKING = ["understanding","reproducing","fixing"];
const FAILED = ["env_error","failed","interrupted"];
const dotClass = s => s.archived && WAITING.includes(s.state) ? "" : s.busy || WORKING.includes(s.state) ? "work" : WAITING.includes(s.state) ? "wait" : FAILED.includes(s.state) ? "fail" : ["applied","test_saved","discarded"].includes(s.state) ? "done" : "";

function drawRoute(){
  const st = S?.stage || "understand", state = S?.state || "";
  let idx = ROUTE.findIndex(r => r[0] === st); if (st === "done") idx = ROUTE.length;
  const failed = ["not_reproduced","needs_info","env_error","not_fixed","failed","interrupted"].includes(state);
  $("#route").innerHTML = ROUTE.map(([k,label],i) => {
    const cls = i < idx ? "done" : i === idx ? (failed ? "fail" : "active") : "";
    return (i ? `<div class="rline ${i <= idx ? "done" : ""}"></div>` : "") +
      `<div class="rstep ${cls}"><span class="rnum">${i < idx ? "✓" : i+1}</span>${label}</div>`;
  }).join("");
}

/* ------------------------------------------------------------------ sidebar */
async function refreshSessions(){
  let list = []; try { list = await api("/api/sessions"); } catch {}
  $("#needCount").textContent = list.filter(s => !s.archived && WAITING.includes(s.state)).length;
  $("#slist").innerHTML = list.map(s => `<div class="sitem ${S && S.id === s.id ? "on" : ""}" data-id="${s.id}">
    <span class="dot ${dotClass(s)}"></span><div><div class="stitle">${esc(s.title)}</div>
    <div class="ssub">${esc(s.id)} · ${esc(s.repo || "")} · ${esc(STATE_TEXT[s.state] || s.state)}</div></div></div>`).join("")
    || `<div class="ssub" style="padding:8px 10px">No sessions yet</div>`;
}
$("#slist").onclick = e => { const id = e.target.closest(".sitem")?.dataset.id; if (id){ openSession(id); closeSide(); } };
$("#newS").onclick = () => { showConnect(); closeSide(); };
$("#menu").onclick = () => { $("#side").classList.add("open"); $("#scrim").classList.add("open"); };
const closeSide = () => { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); };
$("#scrim").onclick = closeSide;

/* ------------------------------------------------------------------ connect (flow 0) */
function showConnect(){

  $("#title").textContent = "New session"; $("#repoPill").textContent = ""; $("#statePill").textContent = "not connected";

  $("#col").innerHTML = `<div class="hero">

    <p>Connect a Python repository and describe a bug. ReproAgent writes a test that fails because of the bug, then makes it pass without breaking anything else. Every step is checked, and your code only changes when you choose Apply.</p>
    <div class="card connect">
      <div class="kicker wine">Step 1 · Connect a repository</div>
      <label for="cpath">Local folder</label>
      <div class="crow2"><input id="cpath" placeholder="/Users/you/projects/my-python-app"><button class="btn primary" id="cgo">Connect</button></div>
      <details style="margin-top:10px;font-size:13px"><summary style="cursor:pointer;color:var(--violet)">Python interpreter (auto-detected)</summary>
        <label for="cpy">Interpreter path</label><input id="cpy" placeholder="Leave empty to use the project's .venv, or this Python"></details>
      <div class="err" id="cerr"></div>

      <div><b>01 Understand</b><span>Reads your report and confirms what the bug is with you</span></div>
      <div><b>02 Reproduce</b><span>Explores the code and writes a failing test</span></div>
      <div><b>03 Fix</b><span>Edits a sandboxed copy until the test passes</span></div>
      <div><b>04 Verify</b><span>No regressions. Then you choose to apply it.</span></div>
    </div></div>`;
  $("#bench").innerHTML = bugs.map((b,i) => `<button data-i="${i}">${esc(b.id)}</button>`).join("");
  $("#bench").onclick = e => { const b = bugs[e.target.dataset.i]; if (!b) return;
    $("#cpath").value = b.repo; $("#cpy").value = b.python; pendingBench = b; connect(); };
  $("#cgo").onclick = () => { pendingBench = null; connect(); };
  $("#cpath").onkeydown = e => e.key === "Enter" && connect();

async function connect(){
  const btn = $("#cgo"); btn.disabled = true; btn.textContent = "Checking…"; $("#cerr").textContent = "";
  try{
    const ws = await api("/api/inspect", {path: $("#cpath").value.trim(), python: $("#cpy").value.trim()});
    if (!ws.ok) throw new Error(ws.error);
    const b = pendingBench;
    const s = await api("/api/sessions", {workspace: ws, bug_id: b?.id, fixed_repo: b?.fixed_repo, gt_test: b?.gt_test});
    await openSession(s.id);
    if (b) { $("#input").value = b.report; autosize(); $("#input").focus(); }
  } catch(e){ $("#cerr").textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = "Connect"; }
}

/* ------------------------------------------------------------------ session view */
async function openSession(id){
  mode = "chat"; n = 0; actGroup = null; hintMode = false; $("#col").innerHTML = ""; $("#navEval").classList.remove("on");
  clearInterval(poller); await pull(id); poller = setInterval(() => pull(id), 1200); refreshSessions();
}

async function pull(id){
  let d; try { d = await api(`/api/sessions/${id}?since=${n}`); } catch { return; }
  if (mode !== "chat") return;
  const prevState = S?.state; S = d;
  const atBottom = $("#thread").scrollHeight - $("#thread").scrollTop - $("#thread").clientHeight < 80;
  d.events.forEach(render); n = d.n;
  $("#title").textContent = d.title; $("#repoPill").textContent = d.workspace?.name || "";
  $("#statePill").textContent = STATE_TEXT[d.state] || d.state; $("#statePill").title = d.archived ? "Archived session (read-only)" : "";
  if (d.state === "interrupted" && !document.querySelector(".interrupted")) add(agentWrap(`<div class="card attn interrupted"><div class="kicker wine">Interrupted</div>
    <p>The server restarted while this session was running, so the run stopped. Your repository was not changed. Start a new session to try again.</p></div>`));
  drawRoute(); updateComposer(); updateWorking();
  // only the newest card can need attention; older decisions are done
  const cards = [...document.querySelectorAll("#col .card")];
  cards.forEach((c,i) => {
    if (i < cards.length - 1) { c.classList.remove("attn"); c.querySelectorAll(".actions .btn").forEach(b => b.disabled = true); }
    else if (!WAITING.includes(d.state) && !["env_error","interrupted"].includes(d.state)) c.classList.remove("attn"); });
  if (d.events.length && atBottom) $("#thread").scrollTop = 1e9;
  if (prevState !== d.state) refreshSessions();
}

function add(html){ const w = document.createElement("div"); w.innerHTML = html; const el = w.firstElementChild; $("#col").appendChild(el); return el; }
const agentWrap = inner => `<div class="msg-agent"><div class="av">R</div><div style="min-width:0">${inner}</div></div>`;

function render(ev){
  document.querySelectorAll(".typingrow").forEach(t => t.remove());
  if (ev.type === "state") return;
  if (ev.type === "step") return addStep(ev.step);
  actGroup = null;
  if (ev.type === "user") return add(`<div class="msg-user">${esc(ev.text)}</div>`);
  if (ev.type === "agent") return add(agentWrap(`<div class="bubble">${esc(ev.text)}</div>`));
  if (ev.type === "card") return add(agentWrap(CARDS[ev.kind]?.(ev.data || {}, ev) ?? `<div class="card">${esc(ev.kind)}</div>`));
}

/* activity groups collapse tool steps into one line each */
const STAGE_LABEL = {preflight:"Checking the environment", reproduce:"Reproducing", fix:"Fixing"};
function addStep(s){
  if (s.kind === "stage" || !actGroup){
    const label = s.kind === "stage" ? (STAGE_LABEL[s.name] || s.name) : "Working";
    actGroup = add(agentWrap(`<div class="activity closed"><div class="ahead"><span class="spin"></span><span class="lbl">${esc(label)}</span>
      <span class="cnt">0 steps</span><span class="tog">Show steps</span></div><div class="alist"></div></div>`)).querySelector(".activity");
    actGroup.querySelector(".ahead").onclick = function(){ const a = this.parentElement; a.classList.toggle("closed");
      this.querySelector(".tog").textContent = a.classList.contains("closed") ? "Show steps" : "Hide steps"; };
    actGroup.count = 0;
    if (s.kind === "stage") return;
  }
  let title = s.kind, detail = "", body = "", cls = "", ic = ICON[s.kind === "tool" ? s.name : s.kind];
  if (s.kind === "tool"){ title = ({list_files:"Listed files",search_code:"Searched code",read_file:"Read file",write_test:"Wrote test",
      run_test:"Ran test",edit_file:"Edited code",replace_lines:"Edited code"})[s.name] || s.name;
    detail = Object.values(s.args||{}).join(" · ").slice(0,200); body = s.result; }
  else if (s.kind === "finish"){ title = "Agent reported" + (s.args?.status ? ": " + s.args.status.replace("_"," ") : " done"); detail = s.args?.explanation; body = detail; }
  else if (s.kind.startsWith("verify")){ cls = s.ok ? "pass" : "fail"; ic = s.ok ? "check" : "x";
    title = `Harness ${s.ok ? "accepted" : "rejected"} the ${s.kind === "verify_fix" ? "fix" : "test"} (attempt ${s.attempt})`; detail = s.ok ? "" : s.why; }
  else if (s.kind === "text"){ title = "Model note"; detail = s.content; body = s.content; }
  else if (s.kind === "baseline_failures"){ title = "Ran existing test suite"; detail = `${s.n ?? "?"} tests already failing before any change`; }
  else if (s.kind === "budget_exhausted"){ title = "Step budget used up for this attempt"; }
  else return;
  actGroup.querySelector(".alist").insertAdjacentHTML("beforeend",
    `<div class="st ${cls}" onclick="this.classList.toggle('open')"><span class="i">${svg(ic)}</span><div style="min-width:0"><div class="tt">${esc(title)}</div>
     ${detail ? `<div class="dd">${esc(detail)}</div>` : ""}${body ? `<pre>${esc(body)}</pre>` : ""}</div></div>`);
  actGroup.count++;
  actGroup.querySelector(".cnt").textContent = `${actGroup.count} step${actGroup.count>1?"s":""} · ${title}`;
}
function updateWorking(){
  const working = S && (S.busy || WORKING.includes(S.state));
  const last = $("#col").lastElementChild;
  document.querySelectorAll(".typingrow").forEach(t => t.remove());
  if (working && !(last && last.querySelector(".activity"))){
    const label = {understanding:"Reading your report…", reproducing:"Starting reproduction…", fixing:"Starting the fix…"}[S.state] || "Working…";
    add(agentWrap(`<div class="typing" title="${label}"><span></span><span></span><span></span></div><div class="ssub">${label}</div>`)).classList.add("typingrow");
  }
  document.querySelectorAll(".activity").forEach((a,i,all) => {
    const sp = a.querySelector(".spin"); if (!sp) return;
    if (!working || i < all.length - 1){ sp.outerHTML = `<span class="ck" style="width:14px;height:14px;font-size:9px">✓</span>`; }
  });
}

/* ------------------------------------------------------------------ cards */
const diffHtml = p => esc(p).split("\n").map(l => l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>` :
  l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>` : l.startsWith("@@") ? `<span class="hunk">${l}</span>` : l).join("\n");
const failLine = ev => (ev || "").split("\n").filter(l => /^E\s/.test(l)).slice(0,3).join("\n") || (ev||"").trim().split("\n").slice(-1)[0];

const CARDS = {
  workspace: d => `<div class="card"><div class="kicker">Repository connected</div><h3>${esc(d.name)}</h3><p style="font-family:var(--mono);font-size:12px">${esc(d.path)}</p>
    <div class="facts"><div class="fact"><div class="k">Python files</div><div class="v">${d.py_files}</div></div>
    <div class="fact"><div class="k">Test files</div><div class="v">${d.test_files}</div></div>
    <div class="fact"><div class="k">Branch</div><div class="v">${esc(d.branch || "not a git repo")}</div></div>
    <div class="fact"><div class="k">Health check</div><div class="v">${d.healthy ? "pytest runs ✓" : "failed ✗"}</div></div></div>
    <p style="margin-top:8px">Interpreter <span style="font-family:var(--mono);font-size:12px">${esc(d.python)}</span></p>
    ${d.healthy ? `<p style="margin:0;color:var(--ink)">Describe the bug below, paste a GitHub issue link, or attach a report.</p>` :
      `<div class="quote">${esc(d.health_output)}</div><p>Fix the environment (install pytest or pick another interpreter) and connect again.</p>`}</div>`,

  understanding: (d, ev) => `<div class="card ${S.state==="awaiting_confirm"?"attn":""}" data-card="understanding"><div class="kicker wine">Here's what I understood</div><h3 class="ued" data-k="title">${esc(d.title)}</h3>
    <div class="fields">${[["observed","What happens"],["expected","What should happen"],["steps","How to trigger"]].map(([k,l]) =>
      `<div class="field"><div class="k">${l}</div><div class="v ued" data-k="${k}">${esc(d[k])}</div></div>`).join("")}
    <div class="field"><div class="k">Code mentioned</div><div class="tags">${(d.entities||[]).map(x => `<span class="tag">${esc(x)}</span>`).join("") || '<span class="ssub">none</span>'}</div></div>
    ${(d.missing||[]).length ? `<div class="field"><div class="k">Missing</div><div class="tags">${d.missing.map(x => `<span class="tag warn">${esc(x)}</span>`).join("")}</div></div>` : ""}</div>
    ${S.state === "awaiting_confirm" && !S.archived ? `<div class="actions"><button class="btn primary" onclick="confirmU(this)">Looks right, reproduce it →</button>
      <button class="btn secondary" onclick="editU(this)">Edit</button><button class="btn ghost" onclick="focusInput('Add details to the report…')">Add details instead</button></div>` : ""}</div>`,

  reproduced: d => `<div class="card ${S.state==="awaiting_fix_decision"?"attn":""}"><div class="kicker wine">Bug reproduced</div><h3>I have a test that fails because of this bug.</h3>
    <p>It fails on your current code for the reason in the report, not because of a setup or import error.</p>
    <div class="quote">${esc(failLine(d.evidence))}</div>
    <ul class="checks"><li><span class="ck">✓</span>Fails on the current code (attempt ${d.attempts})</li>
      ${d.fail_to_pass === true ? `<li><span class="ck">✓</span>Passes on the known fixed version (benchmark check)</li>` :
        d.fail_to_pass === false ? `<li><span class="ck no">✗</span>Also fails on the known fixed version: likely tests the wrong behaviour (benchmark check)</li>` : ""}</ul>
    <details class="box" open><summary>${esc(d.test_path)}</summary><pre>${esc(d.test_code)}</pre></details>
    <details class="box"><summary>pytest output</summary><pre>${esc(d.evidence)}</pre></details>
    ${S.state === "awaiting_fix_decision" && !S.archived ? `<div class="actions"><button class="btn primary" onclick="act('fix',{})">Fix it →</button>
      <button class="btn secondary" onclick="applyFlow(this,false)">Save test to repository</button><button class="btn ghost" onclick="act('discard',{})">Stop here</button></div>
      <div class="confirmslot"></div>` : ""}</div>`,

  not_reproduced: d => `<div class="card ${S.state==="not_reproduced"?"attn":""}"><div class="kicker wine">Not reproduced</div><h3>I couldn't write a test that shows this bug.</h3>
    <p>${d.attempts} attempt${d.attempts>1?"s":""}. The harness rejected each one:</p>
    <ul class="checks">${(d.rejections||[]).slice(-3).map(r => `<li><span class="ck no">✗</span>${esc(r)}</li>`).join("") || "<li>No valid test was produced.</li>"}</ul>
    ${d.test_code ? `<details class="box"><summary>Last attempt</summary><pre>${esc(d.test_code)}</pre></details>` : ""}
    ${d.explanation ? `<p style="margin-top:10px">Agent: ${esc(d.explanation)}</p>` : ""}
    <p style="color:var(--ink);margin-top:10px">Add details in the box below, such as an exact input, the expected output, or the function involved, and I'll try again.</p></div>`,

  needs_info: d => `<div class="card attn"><div class="kicker wine">I need more information</div><h3>${esc(d.explanation || "The report doesn't say enough to write a test.")}</h3>
    <p>Reply below and I'll try again with your answer.</p>${d.test_code ? `<details class="box"><summary>What I tried</summary><pre>${esc(d.test_code)}</pre></details>` : ""}</div>`,

  env_error: d => `<div class="card attn"><div class="kicker wine">Environment problem</div><h3>pytest can't run in this environment.</h3>
    <p>This isn't about your bug. The interpreter can't run a trivial test. Connect again with the right interpreter.</p><pre>${esc(d.output)}</pre>
    <div class="actions"><button class="btn primary" onclick="showConnect()">Reconnect</button></div></div>`,

  fixed: d => `<div class="card ${S.state==="awaiting_apply"?"attn":""}"><div class="kicker wine">Fix verified</div><h3>The test passes now, and nothing else broke.</h3>
    ${d.explanation ? `<p>${esc(d.explanation)}</p>` : ""}
    <ul class="checks"><li><span class="ck">✓</span>The reproduction test passes</li>
      <li><span class="ck ${d.regression_free ? "" : "no"}">${d.regression_free ? "✓" : "✗"}</span>${d.regression_free ? "No test that passed before is failing now" : "Some tests that passed before now fail"}</li>
      ${d.gt_pass != null ? `<li><span class="ck ${d.gt_pass ? "" : "no"}">${d.gt_pass ? "✓" : "✗"}</span>${d.gt_pass ? "Also passes the developers' own test for this bug" : "Does not pass the developers' own test (benchmark check)"}</li>` : ""}
      <li><span class="ck na">${d.attempts}</span>Fix attempt${d.attempts>1?"s":""} used</li></ul>
    <details class="box" open><summary>${d.files.length} file${d.files.length>1?"s":""} · ${d.lines} line${d.lines!==1?"s":""} changed</summary><pre>${diffHtml(d.patch)}</pre></details>
    ${S.state === "awaiting_apply" && !S.archived ? `<div class="actions"><button class="btn primary" onclick="applyFlow(this,true)">Apply to repository</button>
      <button class="btn secondary" onclick='download(${JSON.stringify(JSON.stringify(d.patch))})'>Download patch</button>
      <button class="btn ghost" onclick="act('discard',{})">Discard</button></div><div class="confirmslot"></div>` : ""}</div>`,

  not_fixed: d => `<div class="card ${S.state==="not_fixed"?"attn":""}"><div class="kicker wine">Not fixed</div><h3>I couldn't find a change that makes the test pass without breaking others.</h3>

    ${S.state === "not_fixed" && !S.archived ? `<div class="actions"><button class="btn primary" onclick="startHint()">Retry with a hint</button>
      <button class="btn secondary" onclick="applyFlow(this,false)">Save test to repository</button><button class="btn ghost" onclick="act('discard',{})">Discard</button></div><div class="confirmslot"></div>` : ""}</div>`,

  applied: d => `<div class="card"><div class="kicker">Written to your repository</div><h3>Done.</h3><ul class="checks">${d.files.map(f => `<li><span class="ck">✓</span><span style="font-family:var(--mono);font-size:13px">${esc(f)}</span></li>`).join("")}</ul>
    <p>Review the change with <span style="font-family:var(--mono)">git diff</span> before you commit.</p></div>`,

  error: d => `<div class="card attn"><div class="kicker wine">Something went wrong</div><pre>${esc(d.message)}</pre></div>`,
};

/* ------------------------------------------------------------------ actions */
async function act(action, body){
  try { await api(`/api/sessions/${S.id}/${action}`, body); await pull(S.id); }
  catch(e){ add(agentWrap(`<div class="card attn"><div class="kicker wine">Couldn't do that</div><p>${esc(e.message)}</p></div>`)); }
  rerenderPending();
}
function rerenderPending(){ document.querySelectorAll(".card.attn .actions").forEach(a => a.querySelectorAll("button").forEach(b => b.disabled = true)); }
function confirmU(btn){
  const card = btn.closest(".card"), edited = {};
  card.querySelectorAll(".ued").forEach(el => edited[el.dataset.k] = el.textContent.trim());
  act("confirm", {edited});
}
function editU(btn){
  const card = btn.closest(".card"); const on = btn.textContent === "Edit";
  card.querySelectorAll(".ued").forEach(el => el.contentEditable = on);
  btn.textContent = on ? "Done editing" : "Edit"; if (on) card.querySelector(".ued").focus();
}
function applyFlow(btn, withPatch){
  const slot = btn.closest(".card").querySelector(".confirmslot");
  const files = withPatch ? "the changed source files and the reproduction test" : "only the reproduction test";
  slot.innerHTML = `<div class="confirm">This writes ${files} into <b>${esc(S.workspace.path)}</b>. Nothing is committed. Continue?
    <div class="actions" style="margin-top:10px"><button class="btn primary">${withPatch ? "Apply" : "Save test"}</button><button class="btn ghost">Cancel</button></div></div>`;
  const [ok, cancel] = slot.querySelectorAll("button");
  ok.onclick = () => act("apply", {include_patch: withPatch}); cancel.onclick = () => slot.innerHTML = "";
}
function download(text){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type:"text/x-diff"}));
  a.download = `${S.id}.patch`; a.click();
}
function startHint(){ hintMode = true; updateComposer(); focusInput("Give a hint, e.g. 'the bug is in how total is scaled'"); }
function focusInput(ph){ if (ph) $("#input").placeholder = ph; $("#input").focus(); }

/* ------------------------------------------------------------------ composer */
function setComposer(enabled, ph, hint){
  $("#input").disabled = !enabled; $("#send").disabled = !enabled; $("#attachBtn").disabled = !enabled;
  $("#cbox").classList.toggle("locked", !enabled); $("#input").placeholder = ph;
  $("#chint").textContent = hint || (enabled ? "Enter sends · Shift+Enter for a new line" : "");
}
function updateComposer(){
  if (!S) return;
  if (S.archived) return setComposer(false, "This session is archived (read-only).");
  if (S.busy || WORKING.includes(S.state)) return setComposer(false, "The agent is working…", "You can open another session meanwhile");
  if (hintMode && ["not_fixed","awaiting_fix_decision"].includes(S.state)) return setComposer(true, "Give a hint for the fix…", "Sending retries the fix with your hint");
  ({ awaiting_report: () => setComposer(true, "Describe the bug: what happens, and what you expected. Or paste a GitHub issue link.", "Paste an issue link or attach a .md report"),
     needs_info: () => setComposer(true, "Answer the question above…", "Sending retries the reproduction"),
     not_reproduced: () => setComposer(true, "Add details: an exact input, the expected output, the function involved…", "Sending retries the reproduction"),
     awaiting_confirm: () => setComposer(false, "Confirm or edit what I understood above"),
     awaiting_fix_decision: () => setComposer(false, "Choose what to do with the reproduction test above"),
     awaiting_apply: () => setComposer(false, "Apply, download or discard the fix above"),
     not_fixed: () => setComposer(false, "Retry with a hint, or keep the test"),
  }[S.state] || (() => setComposer(false, "Session finished. Start a new session for another bug.")))();
}
const autosize = () => { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; };
$("#input").oninput = autosize;
$("#input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
$("#send").onclick = send;
$("#attachBtn").onclick = () => $("#file").click();
$("#file").onchange = async () => {
  const f = $("#file").files[0]; if (!f) return; attached = {name: f.name, text: await f.text()};
  $("#attach").innerHTML = `<span class="attach-chip">${esc(f.name)} <a href="#" onclick="attached=null;this.parentElement.remove();return false">✕</a></span>`;
  $("#file").value = "";
};
async function send(){
  if (!S || $("#send").disabled) return;
  let text = $("#input").value.trim();
  if (attached) text = (text ? text + "\n\n" : "") + attached.text;
  if (!text) return;
  const issue = text.match(/^https?:\/\/github\.com\/[^/\s]+\/[^/\s]+\/issues\/\d+$/);
  $("#send").disabled = true;
  try{
    if (issue){
      const d = await api("/api/issue", {url: text});
      text = `${d.title}\n\n${d.body}\n\n(Source: ${d.url})`;
    }
    if (hintMode){ hintMode = false; await act("fix", {hint: text}); }
    else await act("report", {text});
    $("#input").value = ""; attached = null; $("#attach").innerHTML = ""; autosize();
  } catch(e){ add(agentWrap(`<div class="card attn"><div class="kicker wine">Couldn't send</div><p>${esc(e.message)}</p></div>`)); }
  finally { updateComposer(); }
}

/* ------------------------------------------------------------------ evaluation view */
$("#navEval").onclick = async () => {
  mode = "eval"; S = null; clearInterval(poller); closeSide(); refreshSessions(); $("#navEval").classList.add("on");
  $("#title").textContent = "Evaluation"; $("#repoPill").textContent = "benchmark"; $("#statePill").textContent = "results on disk";
  $("#route").innerHTML = ""; setComposer(false, "Evaluation is read-only. Start a new session to run the agent.");
  const rows = await api("/api/results"); const by = {};
  rows.forEach(r => { const m = by[r.mode] ??= {n:0,f2p:0,fixed:0,gt:0,t:0}; m.n++; m.f2p += r.fail_to_pass === true; m.fixed += r.fix_status === "fixed"; m.gt += r.gt_pass === true; m.t += r.seconds; });
  const name = {full:"Full agent", single_shot:"Single-shot", desc_only:"Report only"};
  const yn = v => v === true ? "<td>✓</td>" : v === false ? '<td class="n">✗</td>' : '<td class="z">–</td>';
  $("#col").innerHTML = `<div class="eval"><div class="hero" style="margin-top:8px"><h2 style="font-size:36px">Benchmark results</h2>
    <p>Real bugs from BugsInPy. A reproduction counts as true only if the test fails on the buggy version and passes on the developers' fixed version.</p></div>
    <div class="stats">${Object.entries(by).map(([m,v]) => `<div class="stat"><div class="k">${esc(name[m]||m)}</div><div class="v">${v.f2p}/${v.n} reproduced</div>
      <div class="s">${v.fixed} fixed · ${v.gt} pass developer test · ${Math.round(v.t/v.n)}s average</div></div>`).join("")}</div>
    <div class="tablewrap"><table><thead><tr><th>Bug</th><th>Mode</th><th>Reproduction</th><th>Fail → pass</th><th>Fix</th><th>Dev test</th><th>Time</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b style="font-weight:540">${esc(r.bug_id)}</b></td><td>${esc(name[r.mode]||r.mode)}</td><td>${esc(r.status.replace("_"," "))}</td>${yn(r.fail_to_pass)}
      <td>${esc(r.fix_status.replace("_"," "))}</td>${yn(r.gt_pass)}<td>${r.seconds}s</td></tr>`).join("")}</tbody></table></div></div>`;
};

/* ------------------------------------------------------------------ boot */
(async () => {
  try { $("#modelName").textContent = (await api("/api/config")).model; } catch {}
  try { bugs = await api("/api/bugs"); } catch {}
  showConnect();
  setInterval(refreshSessions, 4000);
})();
</script>
</body>
</html>
